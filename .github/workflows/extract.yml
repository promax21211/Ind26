name: Extract uploaded project
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and flatten
        run: |
          test -f .github/workflows/freedom79.zip || { echo "freedom79.zip not found in workflows folder"; exit 1; }
          mkdir _extracted
          unzip -q .github/workflows/freedom79.zip -d _extracted
          shopt -s dotglob
          cp -r _extracted/freedom79/* .
          rm -rf _extracted .github/workflows/freedom79.zip

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract uploaded project"
          git push
          
